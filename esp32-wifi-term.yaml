substitutions:
  device_name: esp32-wifi-term
  friendly_name: "Холодильная витрина"
  warning_temperature: "6.0"
  alarm_temperature: "8.0"
  recovery_temperature: "5.0"

  # MAC платы без двоеточий.
  narodmon_device_id: "8CD0B2A87C21"
  narodmon_owner: !secret narodmon_owner

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "Мониторинг температуры холодильной витрины"

  project:
    name: "iven.fridge-monitor"
    version: "0.3.0"

  on_boot:
    priority: -100
    then:
      - lambda: |-
          id(temp_history)->add_event("boot", "Контроллер запущен");

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  # В RAM сохраняется максимум 250 уже отформатированных строк.
  # Частые VERBOSE/VERY_VERBOSE логи намеренно не включены.

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  reboot_timeout: 15min

  ap:
    ssid: "${friendly_name} Setup"
    password: !secret fallback_password

  on_connect:
    then:
      - logger.log:
          level: INFO
          format: "Wi-Fi подключён"
      - lambda: |-
          id(temp_history)->add_event("wifi", "Wi-Fi подключён");

  on_disconnect:
    then:
      - logger.log:
          level: WARN
          format: "Wi-Fi отключён"
      - lambda: |-
          id(temp_history)->add_event("wifi", "Wi-Fi отключён");

captive_portal:

web_server:
  port: 80
  version: 3
  include_internal: false
  log: true

  auth:
    username: !secret web_username
    password: !secret web_password
    type: basic

  sorting_groups:
    - id: group_temperature
      name: "Температура"
      sorting_weight: 10
    - id: group_alarms
      name: "Состояние витрины"
      sorting_weight: 20
    - id: group_cloud
      name: "Облачный мониторинг"
      sorting_weight: 30
    - id: group_network
      name: "Сеть"
      sorting_weight: 40
    - id: group_device
      name: "Устройство"
      sorting_weight: 50

http_request:
  useragent: "ESPHome-Fridge-Monitor/0.3"
  timeout: 10s
  verify_ssl: true
  follow_redirects: true

one_wire:
  - platform: gpio
    id: one_wire_bus
    pin: GPIO4

sensor:
  - platform: dallas_temp
    id: fridge_temperature
    name: "Температура витрины"
    one_wire_id: one_wire_bus
    resolution: 12
    update_interval: 30s
    accuracy_decimals: 2
    device_class: temperature
    state_class: measurement

    filters:
      - filter_out: nan
      - median:
          window_size: 5
          send_every: 3
          send_first_at: 1
      - offset: 0.0

    web_server:
      sorting_group_id: group_temperature
      sorting_weight: 10

  - platform: wifi_signal
    id: wifi_signal_db
    name: "Уровень Wi-Fi"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_network
      sorting_weight: 10

  - platform: uptime
    id: device_uptime
    name: "Время работы"
    update_interval: 60s
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_device
      sorting_weight: 20

temperature_history:
  id: temp_history
  sensor_id: fridge_temperature
  capacity: 1000
  sample_interval: 30s
  max_events: 100
  max_log_lines: 250
  max_log_line_length: 220

binary_sensor:
  - platform: status
    name: "Контроллер в сети"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_device
      sorting_weight: 10

  - platform: template
    id: temperature_warning
    name: "Предупреждение: температура выше нормы"
    device_class: problem
    lambda: |-
      return id(fridge_temperature).has_state() &&
             id(fridge_temperature).state > ${warning_temperature};
    filters:
      - delayed_on: 10min
      - delayed_off: 5min
    on_press:
      then:
        - logger.log:
            level: WARN
            format: "ПРЕДУПРЕЖДЕНИЕ: высокая температура"
        - lambda: |-
            id(temp_history)->add_event(
              "warning",
              "Температура выше предупредительного порога"
            );
    on_release:
      then:
        - logger.log:
            level: INFO
            format: "Предупреждение снято"
        - lambda: |-
            id(temp_history)->add_event("recovery", "Предупреждение снято");
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 20

  - platform: template
    id: temperature_alarm
    name: "Авария: критическая температура"
    device_class: problem
    lambda: |-
      return id(fridge_temperature).has_state() &&
             id(fridge_temperature).state > ${alarm_temperature};
    filters:
      - delayed_on: 5min
      - delayed_off: 5min
    on_press:
      then:
        - logger.log:
            level: ERROR
            format: "АВАРИЯ: критическая температура"
        - lambda: |-
            id(temp_history)->add_event("alarm", "Критическая температура");
    on_release:
      then:
        - logger.log:
            level: INFO
            format: "Температура вернулась в допустимый диапазон"
        - lambda: |-
            id(temp_history)->add_event(
              "recovery",
              "Температура вернулась в допустимый диапазон"
            );
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 10

  - platform: template
    id: temperature_sensor_error
    name: "Ошибка датчика температуры"
    device_class: problem
    lambda: |-
      return !id(fridge_temperature).has_state() ||
             isnan(id(fridge_temperature).state);
    filters:
      - delayed_on: 2min
      - delayed_off: 30s
    on_press:
      then:
        - logger.log:
            level: ERROR
            format: "DS18B20 не передаёт данные"
        - lambda: |-
            id(temp_history)->add_event("sensor", "DS18B20 не передаёт данные");
    on_release:
      then:
        - logger.log:
            level: INFO
            format: "Связь с DS18B20 восстановлена"
        - lambda: |-
            id(temp_history)->add_event("sensor", "Связь с DS18B20 восстановлена");
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 30

  - platform: template
    id: narodmon_last_send_ok
    name: "Народный мониторинг: последняя отправка"
    device_class: connectivity
    web_server:
      sorting_group_id: group_cloud
      sorting_weight: 10

text_sensor:
  - platform: template
    id: fridge_state
    name: "Состояние температуры"
    icon: "mdi:thermometer-alert"
    update_interval: 10s
    lambda: |-
      if (!id(fridge_temperature).has_state() ||
          isnan(id(fridge_temperature).state))
        return {"Датчик недоступен"};

      const float temperature = id(fridge_temperature).state;
      if (temperature > ${alarm_temperature}) return {"АВАРИЯ"};
      if (temperature > ${warning_temperature}) return {"Повышенная температура"};
      if (temperature <= ${recovery_temperature}) return {"Норма"};
      return {"Допустимо"};
    web_server:
      sorting_group_id: group_alarms
      sorting_weight: 1

  - platform: template
    id: narodmon_status
    name: "Ответ Народного мониторинга"
    icon: "mdi:cloud-check"
    update_interval: never
    web_server:
      sorting_group_id: group_cloud
      sorting_weight: 20

  - platform: wifi_info
    ip_address:
      name: "IP-адрес"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_network
        sorting_weight: 20
    ssid:
      name: "Wi-Fi сеть"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_network
        sorting_weight: 30
    mac_address:
      name: "MAC-адрес"
      entity_category: diagnostic
      web_server:
        sorting_group_id: group_network
        sorting_weight: 40

  - platform: version
    name: "Версия ESPHome"
    entity_category: diagnostic
    web_server:
      sorting_group_id: group_device
      sorting_weight: 30

button:
  - platform: template
    name: "Открыть историю"
    icon: "mdi:chart-line"
    on_press:
      then:
        - logger.log:
            level: INFO
            format: "История доступна по адресу /history"
    web_server:
      sorting_group_id: group_temperature
      sorting_weight: 20

  - platform: template
    name: "Отправить данные сейчас"
    icon: "mdi:cloud-upload"
    on_press:
      then:
        - script.execute: send_to_narodmon
    web_server:
      sorting_group_id: group_cloud
      sorting_weight: 30

  - platform: restart
    name: "Перезагрузить контроллер"
    entity_category: config
    web_server:
      sorting_group_id: group_device
      sorting_weight: 40

  - platform: safe_mode
    name: "Перезагрузить в безопасном режиме"
    entity_category: config
    web_server:
      sorting_group_id: group_device
      sorting_weight: 50

script:
  - id: send_to_narodmon
    mode: single
    then:
      - if:
          condition:
            and:
              - wifi.connected
              - lambda: |-
                  return id(fridge_temperature).has_state() &&
                         !isnan(id(fridge_temperature).state);
          then:
            - http_request.post:
                url: "https://narodmon.ru/post"
                request_headers:
                  Content-Type: "application/x-www-form-urlencoded"
                body: !lambda |-
                  char request_body[320];
                  snprintf(
                    request_body,
                    sizeof(request_body),
                    "ID=${narodmon_device_id}"
                    "&OWNER=${narodmon_owner}"
                    "&NAME=Fridge-Monitor"
                    "&T1=%.4f"
                    "&RSSI=%.0f",
                    id(fridge_temperature).state,
                    id(wifi_signal_db).has_state()
                      ? id(wifi_signal_db).state
                      : -127.0f
                  );
                  return std::string(request_body);
                capture_response: true
                max_response_buffer_size: 512
                on_response:
                  then:
                    - lambda: |-
                        const bool ok =
                          response->status_code == 200 &&
                          body.find("OK") != std::string::npos;

                        id(narodmon_last_send_ok)->publish_state(ok);

                        if (ok) {
                          id(narodmon_status)->publish_state("OK");
                          id(temp_history)->add_event(
                            "cloud",
                            "Данные отправлены в Народный мониторинг"
                          );
                        } else {
                          id(narodmon_status)->publish_state(
                            "HTTP " +
                            std::to_string(response->status_code) +
                            ": " + body
                          );
                          id(temp_history)->add_event(
                            "cloud",
                            "Ошибка ответа Народного мониторинга"
                          );
                        }
                on_error:
                  then:
                    - lambda: |-
                        id(narodmon_last_send_ok)->publish_state(false);
                        id(narodmon_status)->publish_state("Ошибка соединения");
                        id(temp_history)->add_event(
                          "cloud",
                          "Нет соединения с Народным мониторингом"
                        );
          else:
            - binary_sensor.template.publish:
                id: narodmon_last_send_ok
                state: false
            - text_sensor.template.publish:
                id: narodmon_status
                state: "Нет Wi-Fi или данных датчика"

interval:
  - interval: 5min
    startup_delay: 1min
    then:
      - script.execute: send_to_narodmon
